[project]
name = "receipt-intel"
version = "0.1.0"
description = "Receipt Intelligence Service: FastAPI + Kafka + LLM + OpenTelemetry + Terraform learning project"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "pydantic-settings>=2.4",
    "google-genai>=2.29.0",
    "pgvector>=0.5.1",
    "mcp>=2.3.0",
    "aiokafka>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
